# Antworten eines Sprachmodells gegen die extraktive Basislinie (lokal ausfuehren).
# Benoetigt einen Chat-Server mit OpenAI-kompatibler Schnittstelle, z. B. Ollama:
#   export LLM_BASE_URL=http://localhost:11434/v1 LLM_MODEL=qwen2.5:7b
#   python scripts/experimente.py --config configs/experimente_llm.yaml \
#          --aus ergebnisse_llm --abbildungen docs/abbildungen_llm
# 95 Anfragen an das Modell (80 Korpus- + 15 Fremdfragen). Antworten werden in data/cache/llm/
# gespeichert; ein abgebrochener Lauf setzt beim naechsten Start dort fort.
seed: 0
bootstrap: 2000
tiefe: 50
ks: [1, 5, 10]

referenz: dense
retriever: [dense]

antwort:
  k: 5
  n_saetze: 2
  backends: [extraktiv, llm]
