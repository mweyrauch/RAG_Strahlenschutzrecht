# Erweiterte Varianten fuer die lokale Ausfuehrung. Benoetigt:
#   dense:          pip install -e ".[dense]"  (laedt beim ersten Lauf das Modell, ca. 470 MB)
#   umformuliert:*  einen laufenden Chat-Server, z. B. Ollama (LLM_BASE_URL, LLM_MODEL)
# Diese Varianten sind in der Entwicklungsumgebung NICHT gelaufen; es gibt dazu keine Ergebnisse im README.
seed: 0
bootstrap: 2000
tiefe: 50
ks: [1, 3, 5, 10]

referenz:
  strategie: absatz
  kontext: titel
  retriever: bm25

raster:
  strategien: [absatz]
  kontexte: [titel]
  retriever: [bm25, zeichen_ngramm, hybrid, dense, "hybrid:bm25+dense", "umformuliert:bm25", "umformuliert:hybrid"]

fenster:
  woerter: 120
  ueberlappung: 40

antwort:
  k: 5
  n_saetze: 2
