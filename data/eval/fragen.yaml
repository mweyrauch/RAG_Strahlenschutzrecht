# Evaluationsfragen zum Strahlenschutzgesetz (StrlSchG) und zur Strahlenschutzverordnung (StrlSchV)
#
# Jedes Item hat zwei Formulierungen:
#   fach:   nah am Wortlaut des Gesetzes (geschrieben nach Lektüre der Vorschrift)
#   alltag: so, wie eine fachfremde Person fragen würde, bewusst ohne die Begriffe der Vorschrift
# soll:       Vorschriften, in denen die Antwort steht (Paragraphenebene, Bezeichnung wie im Korpus)
# stichworte: kurze Textstellen, die die Antwort belegen (wörtlich aus der Vorschrift, automatisch geprüft)
# antwort_muster: Formen, an denen eine korrekte Antwort erkannt wird (z. B. "20 mSv" neben
#             "20 Millisievert"); eine Antwort gilt als korrekt, wenn mindestens eines vorkommt.
#             Bewusst kurz gehalten, weil Sprachmodelle den Wortlaut umformulieren.
#
# Stand der Prüfung: Soll-Vorschriften und Stichworte wurden gegen die XML-Fassung von
# gesetze-im-internet.de geprüft (StrlSchG Stand 02.11.2026, StrlSchV Stand 05.08.2025);
# scripts/pruefe_fragen.py prüft automatisch, ob jedes Stichwort in einer Soll-Vorschrift steht.
# Die Auswahl ist klein (40 Items) und von einer Person erstellt; sie ist nicht repräsentativ
# für reale Nutzerfragen.

